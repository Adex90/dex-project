[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "paris"      # no PUSH0 / transient storage: widest L2 / ZK-rollup compatibility
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"     # reproducible builds (verifiable against IPFS-published artifacts)

[fmt]
line_length = 110
