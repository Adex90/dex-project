[package]
name = "threshold-signer"
version = "0.1.0"
edition = "2024"
# The toolchain CI builds with; it also keeps Cargo's MSRV-aware resolver on current dependency releases.
rust-version = "1.97"
description = "StrawberrySwap vault signer: validates and signs the HFT engine's transactions over a local Unix socket"
publish = false

[[bin]]
name = "threshold-signer"
path = "src/main.rs"

[dependencies]
# The signing seam (alloy_signer::Signer): the mock key implements it today; the threshold backend will implement the
# same trait, so the socket protocol and the policy do not change when the key does.
alloy-signer = "2.5.0"
# The MOCK key only: one secp256k1 key generated in memory at start (k256, zeroized on drop), never stored. The
# threshold protocol replaces it.
alloy-signer-local = "2.5.0"
# Address, B256, U256, keccak256, hex.
alloy-primitives = "1.7.3"
# EIP-1559 decoding, the signing hash and the EIP-2718 encoding exactly as the network computes them.
alloy-consensus = { version = "2.5.0", default-features = false, features = ["std", "k256"] }
alloy-rlp = "0.3.17"
# One task per connection on a current-thread runtime; Unix sockets, timeouts, SIGTERM.
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util", "time", "signal", "sync"] }
# The newline-delimited JSON protocol.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[features]
# For the end-to-end tests only: --insecure-test-key-file gives the vault a key the test knows, so that the test can
# look for it in the memory of the vault (positive control) and of the engine (it must not be there). Debug builds
# only: an optimized build with this feature does not compile.
insecure-test-key = []

[profile.release]
# Integer overflow panics in release too.
overflow-checks = true

[dev-dependencies]
# AccessList for the policy tests.
alloy-eips = "2.5.0"
