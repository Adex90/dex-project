[package]
name = "threshold-signer"
version = "0.1.0"
edition = "2024"
# The toolchain CI builds with; it also keeps Cargo's MSRV-aware resolver on current dependency releases.
rust-version = "1.97"
description = "StrawberrySwap vault signer: one role, one AWS KMS key, one contract function, over a local Unix socket"
publish = false

[[bin]]
name = "threshold-signer"
path = "src/main.rs"

[dependencies]
# The signing seam (alloy_signer::Signer): the KMS key implements it today; the threshold backend will implement the
# same trait, so the socket protocol and the policy do not change when the key does.
alloy-signer = "2.6.1"
# The key: a secp256k1 key in AWS KMS (ECC_SECG_P256K1, SIGN_VERIFY). KMS signs a digest and returns DER; the signer
# normalizes it to low s and recovers the parity from the key's public key. The key material never leaves KMS.
alloy-signer-aws = "2.6.1"
# The KMS client. Credentials and region come from the standard AWS chain (on EC2, the instance role); no SSO or
# credential-process providers. alloy-signer-aws pins aws-smithy-types to =1.6.1, so these are the newest releases that
# build against it (the oracle crate's versions).
aws-config = { version = "1.10", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1.114", default-features = false, features = ["default-https-client", "rt-tokio"] }
# Address, B256, U256, keccak256, hex.
alloy-primitives = "1.7.3"
# EIP-1559 decoding, the signing hash and the EIP-2718 encoding exactly as the network computes them.
alloy-consensus = { version = "2.6.1", default-features = false, features = ["std", "k256"] }
alloy-rlp = "0.3.17"
# Strict ABI decoding of the three functions the roles sign, and of the views read at start.
alloy-sol-types = "1.7.3"
# The chain-state rules read the chain over JSON-RPC (rustls; certificate checks on).
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# One task per connection on a current-thread runtime; Unix sockets, timeouts, SIGTERM.
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util", "time", "signal", "sync"] }
# The newline-delimited JSON protocol.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The insecure-test-key feature only: a key read from a file, for the engine's end-to-end tests.
alloy-signer-local = { version = "2.6.1", optional = true }

[features]
# For the engine's end-to-end tests only: --insecure-test-key-file gives the vault a key the test knows, so that the
# test can look for it in the memory of the engine (it must not be there), and lets the vault run without a chain (its
# nonce rule then follows its own signatures only). Debug builds only: an optimized build with this feature does not
# compile.
insecure-test-key = ["dep:alloy-signer-local"]

[profile.release]
# Integer overflow panics in release too.
overflow-checks = true

[dev-dependencies]
# AccessList for the policy tests.
alloy-eips = "2.6.1"
# The policy and protocol tests sign with an in-memory key; the KMS tests sign through a local KMS stand-in.
alloy-signer-local = "2.6.1"
# The local stand-ins: AWS KMS over its wire protocol, and a JSON-RPC node.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
k256 = { version = "0.13.4", features = ["ecdsa", "pkcs8"] }
