# Dependabot version updates: weekly, grouped, with a cooldown so a release is
# proposed only after it has been public for a week (the usual window in which
# a hijacked package is found and pulled). Security updates ignore the cooldown;
# turn on Dependabot alerts and security updates in the repository settings.
#
# Groups: compatible updates arrive as one PR per ecosystem. Majors (and, for
# 0.x Rust crates, minor bumps, which are breaking) come as individual PRs, so
# each breaking change gets its own review and CI run.
#
# Not covered here, bumped by hand: the Rust toolchain and the tool versions and
# checksums in .github/workflows/ci.yml (`env`), and the `postgres:16` service
# image in the workflows (a floating tag on purpose: CI follows 16.x patches).

version: 2

updates:
  # Actions use their major tag (trivy-action an exact release): Dependabot
  # proposes new majors and trivy-action releases. It also maintains SHA pins
  # with a version comment, should the workflows move to those.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    cooldown:
      default-days: 7
    groups:
      cargo-patch:
        update-types: [patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # Playwright for the e2e job (.github/e2e-tools/package-lock.json).
  - package-ecosystem: npm
    directory: /.github/e2e-tools
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    cooldown:
      default-days: 7
    groups:
      e2e-tools:
        patterns: ["*"]

  # Dependabot reads only literal `FROM image[:tag][@sha256:digest]` lines. A
  # base image chosen through a build ARG (`ARG NODE_IMAGE=...` then
  # `FROM ${NODE_IMAGE}`) is invisible to it and has to be bumped by hand.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    cooldown:
      default-days: 7
    groups:
      docker-base-images:
        patterns: ["*"]

  # Images pinned in docker-compose*.yml (PostgreSQL, nginx).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    cooldown:
      default-days: 7
    groups:
      compose-images:
        patterns: ["*"]

  # Provider versions and terraform/.terraform.lock.hcl.
  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    cooldown:
      default-days: 7
    groups:
      terraform-providers:
        patterns: ["*"]
