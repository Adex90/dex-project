services:
  postgres:
    image: postgres:16.4-alpine
    container_name: synthetic-capital-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synthetic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synthetic}
      POSTGRES_DB: ${POSTGRES_DB:-synthetic_capital}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
