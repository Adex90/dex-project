# Synthetic Capital edge: nginx in front of the backend (axum, backend:8080) and the
# frontend (Next.js, frontend:3000) in the single-host docker compose deployment.
#
# Image: the official nginx image, pinned by digest in docker-compose.yml
# (nginx:1.30.6-alpine). Needs nginx >= 1.27.3 (`server ... resolve` in upstreams) and
# OpenSSL >= 3.5 (hybrid post-quantum key exchange, snippets/tls.conf).
#
# Runs as uid 101 with a read-only root filesystem: there is no `user` directive, every
# writable path is on the /tmp tmpfs, and the logs go to a mounted volume.
#
# Container layout (read-only unless noted):
#   /etc/nginx/nginx.conf         this file
#   /etc/nginx/snippets/          tls.conf, security-headers.conf, proxy.conf, rate-limits.conf
#   /etc/nginx/templates/         the site config; the image entrypoint renders it with
#                                 envsubst (only ${PUBLIC_HOST}) into /etc/nginx/conf.d/
#   /etc/nginx/conf.d/            tmpfs owned by uid 101 (the rendered site config)
#   /etc/nginx/allowlist/         optional source allowlists for the provider webhooks
#   /etc/nginx/certs/             fullchain.pem + privkey.pem
#   /var/www/acme/                ACME http-01 webroot, written by certbot on the host
#   /var/log/nginx/               access.log + error.log, read-write host directory that
#                                 the host's fail2ban reads
#   /tmp                          tmpfs owned by uid 101 (pid file, request bodies, buffers)

worker_processes auto;
worker_rlimit_nofile 16384;
pid /tmp/nginx.pid;

# The file is what fail2ban reads (limit_req rejections are logged at "error");
# stderr keeps errors visible in `docker logs`.
error_log /var/log/nginx/error.log warn;
error_log stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;

    # Writable paths on the tmpfs (the binary's defaults point at read-only /var/cache/nginx).
    # nginx creates all five at startup, used or not.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Access log: the "combined" prefix (fail2ban filters and log tools parse it as is)
    # plus timings, upstream status, request id and TLS version. $remote_addr is the real
    # client: nginx is the edge and Docker's DNAT keeps the source address. Timestamps are
    # UTC (the container's zone): fail2ban jails reading these files set logtimezone = UTC.
    log_format edge '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time '
                    'uct="$upstream_connect_time" urt="$upstream_response_time" us="$upstream_status" '
                    'rid=$request_id host="$host" tls=$ssl_protocol';
    access_log /var/log/nginx/access.log edge buffer=16k flush=2s;

    # Client limits and timeouts. 64 KB is the backend's own body limit; only the KYC
    # upload location raises it. client_body_timeout and send_timeout apply between two
    # reads/writes, not to a whole upload.
    client_max_body_size 64k;
    client_body_buffer_size 64k;        # API bodies (<= 64k) stay in memory
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;

    # Behind another proxy or load balancer (NOT the compose deployment, where nginx is the
    # edge), trust only that hop's X-Forwarded-For so $remote_addr, which the rate limits,
    # the logs, fail2ban and the X-Forwarded-For sent upstream all use, stays the client:
    #   set_real_ip_from 10.0.0.0/8;    # the load balancer's addresses, nothing wider
    #   real_ip_header X-Forwarded-For;
    #   real_ip_recursive on;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/rate-limits.conf;
    include /etc/nginx/conf.d/*.conf;
}
