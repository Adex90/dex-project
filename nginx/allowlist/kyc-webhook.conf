# Source addresses allowed to call /api/v1/kyc/webhook (body of an nginx `geo` block:
# "<address or CIDR> 1;"). Every address that does not map to 1 gets 403.
#
# Default: everyone ("default 1"). The backend checks the HMAC signature of every
# result (KYC_WEBHOOK_SECRETO, header X-Kyc-Firma), which is the real authentication.
# To also restrict the source, replace "default 1;" with your biometric provider's
# published egress ranges and reload nginx (docker compose kill -s HUP nginx). For example:
#   203.0.113.64/27  1;
default 1;
