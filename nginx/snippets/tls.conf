# TLS settings (http level: protocol and session settings are negotiated before the
# virtual server is known, so they must be the same for every server on the port).
#
# Certificates: Let's Encrypt via certbot on the host (http-01 through the edge's
# /.well-known/acme-challenge/ location; nginx/certbot-deploy-hook.sh installs renewals)
# or your CA. Mounted read-only; privkey.pem must be readable by uid 101.
ssl_certificate     /etc/nginx/certs/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/privkey.pem;

# Default: TLS 1.3 only. Every current browser and HTTP library speaks it; TLS 1.3 has
# no weak suites, no RSA key exchange, no renegotiation or compression, and always
# forward secrecy. Its suites (AES-GCM, ChaCha20-Poly1305) are not set by ssl_ciphers.
ssl_protocols TLSv1.3;

# Opt-in TLS 1.2, only if a counterparty cannot do 1.3 (e.g. an older SPEI or KYC
# provider client posting webhooks): replace the ssl_protocols line above with these two.
# ECDHE key exchange + AEAD ciphers only (Mozilla "intermediate" without DHE): no CBC,
# no static RSA, no SHA-1. Check the provider's egress ranges in the webhook allowlist.
#   ssl_protocols TLSv1.2 TLSv1.3;
#   ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# Every enabled suite is strong: let the client choose (ChaCha20 on phones without AES).
ssl_prefer_server_ciphers off;

# Key exchange: hybrid post-quantum X25519+ML-KEM-768 first (OpenSSL >= 3.5; current
# Chrome, Firefox and Safari offer it), then classic ECDHE. No finite-field DH groups.
ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;

# Sessions: server-side cache (~4000 sessions per MB), no session tickets. Ticket keys
# would live as long as the workers and weaken forward secrecy; with tickets off,
# TLS 1.3 resumption still works through this shared cache.
ssl_session_cache shared:TLS:10m;
ssl_session_timeout 1h;
ssl_session_tickets off;

# 0-RTT early data can be replayed by an attacker: never for a bank.
ssl_early_data off;

# OCSP stapling: off. Let's Encrypt shut down its OCSP service in 2025 (certificates
# carry no OCSP URL; revocation is published through CRLs), so stapling would only log
# warnings. With a CA that still runs OCSP, add:
#   ssl_stapling on;
#   ssl_stapling_verify on;
#   ssl_trusted_certificate /etc/nginx/certs/chain.pem;   # issuer + intermediates
#   resolver <public resolver>;  # the responder is fetched by nginx itself: this also
#                                 # needs an egress network for the nginx container
