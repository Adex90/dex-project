# WebSocket upgrade, for the Sovereign Vault's real-time channel
# (location = /api/v1/vault/ws). A location with its own proxy_set_header inherits
# none from proxy.conf, so its forwarding headers are repeated here; only Connection
# differs ("upgrade" instead of "" for keep-alive).

proxy_http_version 1.1;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "upgrade";

proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Request-Id      $request_id;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Middleware-Subrequest "";

# The backend pings every 25 s and closes a socket after 75 s without a frame from the
# browser; the proxy must outlast both, or it would cut healthy sockets.
proxy_read_timeout 90s;
proxy_send_timeout 90s;
# Frames go through as they come.
proxy_buffering off;
