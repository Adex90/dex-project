# Rate-limit and connection zones (http level), keyed by client address. Each 10 MB
# zone holds about 160,000 addresses. Values are per address, so a carrier-grade NAT
# shares them: they bound abuse from one source and stay far above what one person
# does. The locations that use them are in the site config.
#
#   zone      rate     burst (site config)  for
#   auth      5r/m     10                   /api/v1/auth/ (sign-in, sign-up); the backend
#                                           also locks an account after failed sign-ins
#   kyc       4r/m     4                    /api/v1/kyc/verificar (12 MB INE + selfie;
#                                           a customer gets KYC_MAX_INTENTOS attempts)
#   api       10r/s    50                   the rest of /api/ and /salud
#   webhook   50r/s    200                  /api/v1/spei/webhook/*, /api/v1/kyc/webhook
#                                           (per provider address; burst for batches)
#   site      30r/s    200                  pages and static assets (a page load fetches
#                                           20-40 files at once over HTTP/2)
limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/m;
limit_req_zone $binary_remote_addr zone=kyc:10m     rate=4r/m;
limit_req_zone $binary_remote_addr zone=api:10m     rate=10r/s;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=site:10m    rate=30r/s;

# Concurrent requests per address. Over HTTP/2 every in-flight request counts as one
# connection, hence 100 for the site; at most 2 KYC uploads at a time per address.
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
limit_conn_zone $binary_remote_addr zone=conn_kyc:10m;

# Rejections answer 429 (JSON on API paths) and are logged at "error" as
# 'limiting requests, excess: ... by zone "...", client: <ip>' (fail2ban's
# nginx-limit-req filter); delayed requests are logged one level lower.
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level error;
limit_conn_log_level error;
