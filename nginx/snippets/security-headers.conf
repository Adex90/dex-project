# Response headers of the HTTPS server, included once at server level.
# nginx rule: a location or named location with ANY add_header of its own inherits
# none of these; include this file there again. `always` = error responses too.

# HSTS for 2 years, subdomains included. No `preload` by default: the browser preload
# list is a one-way, months-long commitment for the whole registrable domain. Append
# "; preload" (and submit the domain at hstspreload.org) only once every subdomain of
# that domain is HTTPS-only.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Content Security Policy for the Next.js app (harmless on JSON answers). Checked in
# Chromium against every page and the onboarding camera pipeline:
#   script-src 'unsafe-inline'  prerendered static pages carry inline bootstrap scripts
#                               (self.__next_f.push) and cannot get per-request nonces
#   style-src 'unsafe-inline'   React style={{...}} attributes (meters, progress bars)
#   img-src data: blob:         onboarding previews are canvas.toDataURL() JPEG data URLs;
#                               the photo-upload fallback decodes through blob: URLs
#   (camera)                    getUserMedia needs no CSP source: the stream reaches the
#                               <video> through srcObject, and drawImage/toDataURL fetch
#                               nothing. The camera itself is gated by Permissions-Policy.
#   connect-src 'self'          the API is same-origin (NEXT_PUBLIC_API_URL = this origin)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

add_header X-Content-Type-Options "nosniff" always;
# Legacy twin of frame-ancestors 'none' for old browsers.
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# camera=(self): the onboarding wizard photographs the INE and takes the liveness selfie.
# A document keeps the policy it was loaded with, so it must hold on every page.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Not security headers, but they obey the same inheritance rule:
# the correlation id sent upstream (snippets/proxy.conf) and logged as rid=...
add_header X-Request-Id $request_id always;
# "no-store" on API answers unless the backend chose a Cache-Control (map in the site config).
add_header Cache-Control $edge_cache_control always;
