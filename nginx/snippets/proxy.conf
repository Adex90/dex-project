# Upstream (proxy_pass) settings of the HTTPS server, included once at server level.
# nginx rule: a location with ANY proxy_set_header (or proxy_hide_header) of its own
# inherits none of these; include this file there again.

proxy_http_version 1.1;
proxy_set_header Connection "";               # keep-alive connections to the upstreams

proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
# Client address. nginx is the edge: whatever the client wrote is discarded and only the
# TCP peer is sent. The backend (HTTP_PROXY_CONFIABLE=true) takes the LAST
# X-Forwarded-For hop, which is therefore always the address nginx saw.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
# Correlation id generated here (32 hex characters), logged as rid= and returned to the
# client; a client-supplied X-Request-Id is replaced.
proxy_set_header X-Request-Id      $request_id;
# Client headers no upstream should ever trust (an empty value removes the header):
proxy_set_header Forwarded "";                # RFC 7239 twin of X-Forwarded-For
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Middleware-Subrequest "";  # Next.js internal (CVE-2025-29927 class)

proxy_connect_timeout 5s;
proxy_send_timeout    15s;
# The backend ends every request after HTTP_PETICION_SEG (30 s) with its own JSON 503
# TIEMPO_AGOTADO: wait a little longer so that answer, not a bare 504, reaches the client.
proxy_read_timeout    35s;

# Whole request bodies are received before the upstream sees them (slow clients stay
# here), and responses are buffered in memory only (16k buffers: Next.js sends long
# Link/Vary headers). Nothing is spooled to disk.
proxy_request_buffering on;
proxy_buffering on;
proxy_buffer_size 16k;
proxy_buffers 16 16k;
proxy_busy_buffers_size 32k;
proxy_max_temp_file_size 0;
proxy_redirect off;

# The edge sets these headers itself (snippets/security-headers.conf): drop the
# upstreams' copies so browsers never get duplicate or conflicting values.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header X-Request-Id;
proxy_hide_header X-Powered-By;
